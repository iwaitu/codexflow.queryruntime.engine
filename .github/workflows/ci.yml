name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secrets, dependencies, licenses & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Secret scan (current tree)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --redact --no-banner

      - name: Secret scan (complete Git history)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact --no-banner

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Dependency vulnerability and license gates
        run: bash scripts/qre-dependency-gate.sh

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/qre-sbom.spdx.json
          artifact-name: qre-sbom.spdx.json
          syft-version: v1.51.0
          upload-release-assets: false

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Verify clean checkout
        run: test -z "$(git status --short --untracked-files=no)"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CodexFlow.QueryRuntime.slnx

      - name: Build
        run: dotnet build CodexFlow.QueryRuntime.slnx --configuration Release --no-restore

      - name: Test (unit)
        run: |
          dotnet test CodexFlow.QueryRuntime.UnitTests/CodexFlow.QueryRuntime.UnitTests.csproj \
            --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build and verify v2 examples (offline)
        env:
          QRE_EXAMPLE_CONFIGURATION: Release
        run: |
          dotnet build examples/RepoDoctor --configuration Release
          dotnet build examples/EmbeddedV2 --configuration Release
          dotnet build examples/H1CrashResume --configuration Release
          python3 scripts/test-examples.py

      - name: Pack NuGet package
        run: |
          scripts/qre-pack-nuget.sh Release
          bash scripts/qre-package-smoke.sh artifacts/nuget

  aot:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    # P3 Native AOT lane: publishes the real `qre` binary, fails on unapproved
    # trim/AOT warnings (scripts/qre-aot-gate.sh), and smokes the produced native
    # binary (scripts/qre-aot-smoke.sh) instead of a framework-dependent CLI.
    #
    # linux-x64 is the proven, blocking RID. osx-arm64 runs non-blocking
    # (continue-on-error) until it is observed stable on CI, then flip
    # `blocking: true` to gate merges on it as well.
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            blocking: true
          - os: macos-14
            rid: osx-arm64
            blocking: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v clang >/dev/null 2>&1 || ! dpkg -s zlib1g-dev >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang zlib1g-dev
          fi

      - name: Publish Native AOT + trim/AOT warning gate
        run: |
          set -euo pipefail
          scripts/qre-aot-gate.sh ${{ matrix.rid }} Release | tee /tmp/qre-aot-gate.log
          QRE_BINARY="$(grep -m1 '^qre_binary=' /tmp/qre-aot-gate.log | sed 's/^qre_binary=//')"
          test -n "$QRE_BINARY"
          printf 'QRE_BINARY=%s\n' "$QRE_BINARY" >> "$GITHUB_ENV"

      - name: Smoke test the native binary
        run: scripts/qre-aot-smoke.sh "$QRE_BINARY"
