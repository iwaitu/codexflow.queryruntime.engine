name: Release

# Publishes single-file Native AOT `qre` binaries for every supported platform.
# Releases are started manually with a version and source ref.
#
# Native AOT cannot cross-compile across operating systems, so each target is
# built on a matching native runner.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (without leading v), e.g. 0.1.0-alpha.1'
        required: true
        default: '0.0.0-dev'
      release_ref:
        description: 'Reviewed commit SHA or protected branch to release'
        required: true
        default: 'main'

permissions:
  contents: read

concurrency:
  group: qre-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      target_commitish: ${{ steps.meta.outputs.target_commitish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Resolve version
        id: meta
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1
          TAG_STATUS=$?
          set -e
          case "$TAG_STATUS" in
            0) echo "Release tag v$VERSION already exists; published versions are immutable." >&2; exit 1 ;;
            2) ;;
            *) echo "Unable to verify whether release tag v$VERSION exists." >&2; exit 1 ;;
          esac

          RELEASE_STATUS="$(curl --silent --show-error --output /tmp/qre-release.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")"
          case "$RELEASE_STATUS" in
            404) ;;
            200) echo "GitHub release v$VERSION already exists; published versions are immutable." >&2; exit 1 ;;
            *) echo "Unable to verify GitHub release v$VERSION (HTTP $RELEASE_STATUS)." >&2; exit 1 ;;
          esac

          CHECKOUT_REF="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$CHECKOUT_REF" origin/main; then
            echo "Release ref must be a commit contained in origin/main." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "checkout_ref=$CHECKOUT_REF"
            echo "target_commitish=$CHECKOUT_REF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
          echo "Resolved checkout ref: $CHECKOUT_REF"

  test:
    name: Build & unit-test release ref
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore CodexFlow.QueryRuntime.slnx
      - run: dotnet build CodexFlow.QueryRuntime.slnx --configuration Release --no-restore
      - run: dotnet test CodexFlow.QueryRuntime.UnitTests/CodexFlow.QueryRuntime.UnitTests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  build:
    name: Build ${{ matrix.rid }}
    needs: [metadata, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT + trim/AOT warning gate
        shell: bash
        env:
          QRE_PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          scripts/qre-aot-gate.sh ${{ matrix.rid }} Release | tee qre-aot-gate.log
          QRE_BINARY="$(grep -m1 '^qre_binary=' qre-aot-gate.log | sed 's/^qre_binary=//')"
          test -n "$QRE_BINARY"
          scripts/qre-aot-smoke.sh "$QRE_BINARY"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PUB="CodexFlow.QueryRuntime.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish"
          OUT="qre-${{ matrix.rid }}.tar.gz"
          chmod +x "$PUB/qre"
          tar -czf "$OUT" -C "$PUB" qre
          shasum -a 256 "$OUT" > "$OUT.sha256" 2>/dev/null || sha256sum "$OUT" > "$OUT.sha256"
          ls -la "$OUT" "$OUT.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pub = "CodexFlow.QueryRuntime.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish"
          $out = "qre-${{ matrix.rid }}.zip"
          Compress-Archive -Path "$pub/qre.exe" -DestinationPath $out -Force
          (Get-FileHash $out -Algorithm SHA256).Hash.ToLower() + "  " + $out | Out-File -Encoding ascii "$out.sha256"
          Get-ChildItem $out, "$out.sha256"

      - name: Smoke packaged artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          OUT="qre-${{ matrix.rid }}.tar.gz"
          SCRATCH="$(mktemp -d)"
          trap 'rm -rf "$SCRATCH"' EXIT
          tar -xzf "$OUT" -C "$SCRATCH"
          chmod +x "$SCRATCH/qre"
          "$SCRATCH/qre" --version
          mkdir -p "$SCRATCH/workspace"
          "$SCRATCH/qre" doctor --workspace "$SCRATCH/workspace" --json
          "$SCRATCH/qre" run \
            --workspace "$SCRATCH/workspace" \
            --profile none \
            --response "package smoke" \
            --json \
            "smoke packaged qre"

      - name: Smoke packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "qre-${{ matrix.rid }}.zip"
          $scratch = Join-Path $env:RUNNER_TEMP ("qre-package-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $scratch | Out-Null
          Expand-Archive -Path $out -DestinationPath $scratch -Force
          $qre = Join-Path $scratch "qre.exe"
          $workspace = Join-Path $scratch "workspace"
          New-Item -ItemType Directory -Path $workspace | Out-Null
          & $qre --version
          if ($LASTEXITCODE -ne 0) { throw "qre --version failed" }
          & $qre doctor --workspace $workspace --json
          if ($LASTEXITCODE -ne 0) { throw "qre doctor failed" }
          & $qre run --workspace $workspace --profile none --response "package smoke" --json "smoke packaged qre"
          if ($LASTEXITCODE -ne 0) { throw "qre run failed" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qre-${{ matrix.rid }}
          path: |
            qre-${{ matrix.rid }}.tar.gz
            qre-${{ matrix.rid }}.tar.gz.sha256
            qre-${{ matrix.rid }}.zip
            qre-${{ matrix.rid }}.zip.sha256
          if-no-files-found: ignore

  security:
    name: Secrets, dependencies, licenses & SBOM
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Secret scan (current tree)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /repo --redact --no-banner

      - name: Secret scan (complete Git history)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact --no-banner

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Dependency vulnerability and license gates
        run: bash scripts/qre-dependency-gate.sh

      - name: Prepare SBOM output directory
        run: mkdir -p artifacts

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/qre-sbom.spdx.json
          artifact-name: qre-sbom
          syft-version: v1.51.0
          upload-release-assets: false

  nuget:
    name: Pack NuGet package
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Pack libraries
        shell: bash
        env:
          QRE_PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
          QRE_NUGET_OUTPUT: artifacts/nuget
        run: scripts/qre-pack-nuget.sh Release

      - name: Smoke clean package
        run: bash scripts/qre-package-smoke.sh artifacts/nuget

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qre-nuget
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/nuget/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [metadata, build, nuget, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Attest release artifacts (Sigstore-backed provenance)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: 'dist/*'

      - name: Create immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TARGET_COMMITISH: ${{ needs.metadata.outputs.target_commitish }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_COMMITISH" \
            --title "qre v$VERSION" \
            --generate-notes
