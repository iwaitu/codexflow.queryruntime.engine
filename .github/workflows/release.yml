name: Release

# Publishes single-file Native AOT `qre` binaries for every supported platform
# after CI succeeds on main, whenever a version tag (e.g. v0.1.0-alpha.1) is
# pushed, or when the workflow is manually dispatched.
#
# Native AOT cannot cross-compile across operating systems, so each target is
# built on a matching native runner.

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (without leading v), e.g. 0.1.0-alpha.1'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.meta.outputs.version }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      target_commitish: ${{ steps.meta.outputs.target_commitish }}
    steps:
      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CHECKOUT_REF="${{ github.event.workflow_run.head_sha }}"
          else
            CHECKOUT_REF="${GITHUB_SHA}"
          fi
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.checkout_ref }}

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' CodexFlow.QueryRuntime.Cli/CodexFlow.QueryRuntime.Cli.csproj | head -n 1)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Failed to resolve release version." >&2
            exit 1
          fi

          CHECKOUT_REF="${{ steps.ref.outputs.checkout_ref }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "target_commitish=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"
          echo "Resolved checkout ref: $CHECKOUT_REF"

  build:
    name: Build ${{ matrix.rid }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        shell: bash
        run: |
          dotnet publish CodexFlow.QueryRuntime.Cli \
            -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=true -p:SelfContained=true \
            -p:Version=${{ needs.metadata.outputs.version }} \
            -p:AssemblyInformationalVersion=${{ needs.metadata.outputs.version }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PUB="CodexFlow.QueryRuntime.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish"
          OUT="qre-${{ matrix.rid }}.tar.gz"
          chmod +x "$PUB/qre"
          tar -czf "$OUT" -C "$PUB" qre
          shasum -a 256 "$OUT" > "$OUT.sha256" 2>/dev/null || sha256sum "$OUT" > "$OUT.sha256"
          ls -la "$OUT" "$OUT.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pub = "CodexFlow.QueryRuntime.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish"
          $out = "qre-${{ matrix.rid }}.zip"
          Compress-Archive -Path "$pub/qre.exe" -DestinationPath $out -Force
          (Get-FileHash $out -Algorithm SHA256).Hash.ToLower() + "  " + $out | Out-File -Encoding ascii "$out.sha256"
          Get-ChildItem $out, "$out.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qre-${{ matrix.rid }}
          path: |
            qre-${{ matrix.rid }}.tar.gz
            qre-${{ matrix.rid }}.tar.gz.sha256
            qre-${{ matrix.rid }}.zip
            qre-${{ matrix.rid }}.zip.sha256
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          target_commitish: ${{ needs.metadata.outputs.target_commitish }}
          name: qre v${{ needs.metadata.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
